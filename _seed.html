<!DOCTYPE html><meta charset="utf-8"><script type="module">
import { dayFor, exercisesOf } from './js/data/workouts.js';
const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const w=[],d={},s={};
for(let i=45;i>=0;i--){const dt=new Date();dt.setDate(dt.getDate()-i);
 const k=key(dt),day=dayFor(dt),base=91.6-(45-i)*0.07+Math.sin(i*1.7)*0.3;
 if(i%5!==2){w.push({date:k,time:'07:10',kg:Math.round(base*10)/10,kind:'checkin',dayId:day.id});
  if(!day.rest)w.push({date:k,time:'08:20',kg:Math.round((base-0.3)*10)/10,kind:'checkout',dayId:day.id});}
 const skip=i%6===3;
 d[k]={meals:{breakfast:true,lunch:true,dinner:!skip},habits:{smoking:{tracked:true,value:0},water:{tracked:true,value:7}}};
 if(!day.rest&&!skip&&i>0){const ex={};for(const id of exercisesOf(day))ex[id]={done:true,sets:[
   {type:'warmup',reps:10,weight:40,done:true},
   {type:'working',reps:8,weight:55+(45-i)*0.2,rpe:8,done:true},
   {type:'working',reps:8,weight:55+(45-i)*0.2,rpe:9,done:true}]};
  s[`${k}|${day.id}`]={dayId:day.id,startedAt:dt.getTime(),endedAt:dt.getTime()+70*6e4,ex};}}
localStorage.setItem('gym.v1.settings',JSON.stringify({name:'Kaarthikeya',units:'kg',startWeight:91.6,targetWeight:72.5,targetMin:70,targetMax:75,defaultSets:4}));
localStorage.setItem('gym.v1.weights',JSON.stringify(w));
localStorage.setItem('gym.v1.days',JSON.stringify(d));
localStorage.setItem('gym.v1.sessions',JSON.stringify(s));
location.replace('./index.html'+(location.hash||'#/'));
</script>
